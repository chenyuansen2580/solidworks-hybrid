      - 自交检查只抽查前 4000 点（完整 6600 段是 O(n²)），完整图形靠目视
      - shapely 缺失时自交检查会抛，其余检查不受影响
      - 不涉及 SW 建模；要出实体仍需走 gear.involute / gear.full_ring
    evidence: "椭圆偏差 0.00e+00 / 传动比 100.0 精确 / 啮合 29 齿 14.5% / backlash 0.0164mm"
