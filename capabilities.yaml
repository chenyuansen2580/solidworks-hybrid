schema_version: "1.0"

# 单一真相源：能力等级、限制、依赖、版本、允许模式都在这里。
# swlib_v2.CAPABILITIES 从本文件加载；文档数字从本文件统计。
# 绝不手写"38 verified"这类会过期的数字。

verified_versions:
  solidworks: ["2022 SP5 (30.5.0.0049)"]
  python: ["3.12.4", "3.13 (早绑定缓存路径随版本变化)"]

backend_catalog:
  solidworks-com-pywin32:
    language: Python
    runtime: out_of_process_automation
    suitable_for:
      - 本机 SW2022 原生 SLDPRT/SLDASM/SLDDRW
      - 显式构造 VARIANT/SAFEARRAY 的参数
      - 体积/bbox/特征树三重断言
    limitations:
      - 依赖 Windows COM，跨平台不可用
      - 接口归属和参数顺序必须查本机类型库，不照抄 SW2024/2026 结论

operation_routes:
  - id: solidworks_native_modeling
    label: 本机 SW2022 原生建模
    candidates:
      - backend: solidworks-com-pywin32
        semantics: exact_automation
        priority: 10
    review_required: true

capabilities:
  # ============================================================ verified
  - id: part.extrude
    label: 拉伸凸台
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
      - 草图必须先选中（FeatureExtrusion3 返回 None 的头号原因）
      - 用 V.extrude_checked，内部 5 级选草图回退
    evidence: "P1 4800000 -> dev 0.0000%"
    allowed_modes: [interactive, reviewed]

  - id: part.cut_through
    label: 贯穿切除
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
      - Sd=False + T1=T2=ThroughAll 才是双向贯穿
      - reverse=True 走 Dir=False（负法向），不是 Flip（切外侧）
    evidence: "P2 轴承孔 22 精确"
    allowed_modes: [interactive, reviewed]

  - id: part.cut_blind
    label: 盲孔切除
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
      - StartOffset 本机无效，盲孔起点由草图平面决定
      - 深度方向需实测确认（probe_dirsem.py）
    evidence: "P1 4xØ5.5 深 15 Δ1425.5"
    allowed_modes: [interactive, reviewed]

  - id: sketch.arc
    label: 草图圆弧
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
      - CreateArc2 参数单位是【米】，swlib.line 内部已乘 MM，手写要 ×0.001
    evidence: "P8 跑道形 1111mm，端点坐标验证"
    allowed_modes: [interactive, reviewed]

  - id: sketch.spline
    label: 草图样条
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
      - 连续点距 <1e-5 会退化为退化曲线被静默丢弃，先去重
    evidence: "P3/P4 整环 2301/4601 点闭合"
    allowed_modes: [interactive, reviewed]

  - id: pattern.circular
    label: 圆周阵列
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
      - 母特征必须传切除特征名（类型名 ICE），传草图名返回 None
      - 轴必须垂直于「孔心↔中心」连线，否则体积反增
      - count=N 新增 N-1 孔（母特征算第 1 个）
    evidence: "count=2/4/6 新增 1/3/5 孔，体积精确"
    allowed_modes: [interactive, reviewed]

  - id: part.fillet
    label: 圆角
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
      - SW2022 是 7 参（GitHub 4 参是 SW2024+）
      - 多条边必须 append 逐次递增，否则只倒最后一条
    evidence: "P1 4 外棱 R2 dev 0.0000%"
    allowed_modes: [interactive, reviewed]

  - id: part.chamfer
    label: 倒角
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
      - 同 fillet，多条边 append 必须递增
    evidence: "P2 外缘 C1"
    allowed_modes: [interactive, reviewed]

  - id: part.revolve
    label: 旋转
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
      - 中心线必须沿草图 Y；轮廓「X=半径、Y=轴线」
      - 画在 X 方向会绕错轴，体积偏差可达 768%
    evidence: "P12 dev 0.0000%"
    allowed_modes: [interactive, reviewed]

  - id: part.loft
    label: 放样
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
      - 截面必须平行（垂直平面返回 None），用 offset_plane
      - 逐张 Select2(mark=1)，不用 MultiSelect2
    evidence: "P10 r25->r15 dev 0.0000%"
    allowed_modes: [interactive, reviewed]

  - id: part.sweep
    label: 扫描
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
