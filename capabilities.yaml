    limitations:
      - 只做**解析几何与理论体积**校核（给 SW 实测提供独立基准），不建实体
      - 齿廓用 gearmath 的多边形近似，不是 CNC 级精确齿形
      - 旧版只打印不断言（数值错了也退出 0）；2026-11-22 已加真断言
      - 侧隙只输出供参考，不作为 pass/fail 条件
    evidence: "zr=zs+2zp / i=5.0 / 装配(30%3=0) / 邻接 58.4567>43.5 / 4 个正体积 + 中心距"
    allowed_modes: [interactive, reviewed]

  # ============================================================ 2026-11-21 新增
  # 对标 wzyn20051216/solidworks-automation-skill（2230★）的 6 个缺口补全。
  # 等级按本机实测证据定，绝不因为"对标工具有"就标 verified。

  - id: review.run
    label: 结果自审查（四视图+像素判据）
    level: verified
    backends: [local-python, solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [review.py, Pillow, numpy, swlib_v2.py]
    limitations:
      - 预览非空白 ≠ 模型正确；比例/方位/部件缺失/重叠悬空仍须人眼复核
      - 像素判据只排除空白图/同图/裁切，不判断几何是否可制造
      - 内容占比下限 1%、色数下限 6 是本机 1290x683 渲染实测值
      - 背景色取出现最多的量化色，不假定纯白（本机背景是浅灰渐变）
    evidence: "圆柱 4 视图 md5 互异 / 内容 5.6~24.2% / 色数 36~39 / status=pass"
    allowed_modes: [interactive, reviewed]

  - id: review.image_stats
    label: 像素统计（内容占比/色数/贴边）
    level: verified
    backends: [local-python]
    verified_versions: ["2022 SP5"]
    dependencies: [review.py, Pillow, numpy]
    limitations:
      - 色数必须在原始分辨率上数，缩小图会把硬边插值成过渡色
      - 贴边判定阈值 1%，只提示不阻断（WARN）
    evidence: "空白图 content 0.000→FAIL / 单色块 colors=6→WARN / 贴边四边全检出"
    allowed_modes: [interactive, reviewed]

  - id: appearance.verify_readback
    label: 设色后回读校验
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32, swlib_v2.py]
    limitations:
      - GetMaterialPropertyValues2 返回 8bit 量化值，偏差恒约 0.002，tol 不能小于 0.01
      - 未设过色时回读 (-1,-1,-1) 哨兵，语义是"继承零件外观"
      - 只覆盖组件级；零件级 set_color 已有独立回读
    evidence: "设 (0.92,0.72,0.30) 回读 (0.918,0.718,0.298) dev=0.0024；tol=1e-9 正确抛"
    allowed_modes: [interactive, reviewed]

  - id: appearance.palette
    label: 批量上色+批量回读
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32, swlib_v2.py]
    limitations:
      - strict=True 时首项失败即抛，后续不再尝试
      - 键必须与 comps() 返回的实例名一致
    evidence: "2 组件批量上色，applied=2 failed=0，全部回读命中"
    allowed_modes: [interactive, reviewed]

  - id: com.byref_out
    label: by-ref 出参（VARIANT）
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [pywin32, swlib.py]
    limitations:
      - 早绑定 _ApplyTypes_ 不接受 VARIANT 形式 by-ref，会 TypeError
      - 取真实出参必须降级动态绑定（swlib.as_dynamic / call_byref）
      - 早绑定只能拿返回元组里的出参，且入参要传普通 0
