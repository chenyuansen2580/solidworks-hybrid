      - 轮廓平面垂直于路径起点切线
      - 路径线段 mark=4 逐段 append
    evidence: "P8 闭环 1111mm dev -0.02%"
    allowed_modes: [interactive, reviewed]

  - id: part.shell
    label: 抽壳
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
      - 面必须 IFace2→IEntity.Select4(mark=1)
      - 所有诊断在选面【之前】做完，否则清空选择集
      - 旋转体端面抽壳会被 SW 拒绝，方块才行
    evidence: "P1 双端抽壳 4800000->1920000"
    allowed_modes: [interactive, reviewed]

  - id: ref.offset_plane
    label: 偏移基准面
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
      - offset_plane 返回 CDispatch，不能直接当名字，用 offset_plane_named
    evidence: "P10 基准面1 @60mm"
    allowed_modes: [interactive, reviewed]

  - id: part.mirror
    label: 镜像
    level: verified
    backends: [solidworks-com-pywin32]
    verified_versions: ["2022 SP5"]
    dependencies: [SolidWorks, pywin32]
    limitations:
