# -*- coding: utf-8 -*-
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-hybrid"
version = "0.1.0"
description = "SolidWorks 2022 建模 + 装配验真融合技能（swlib_v2 建模 / sw_assembly + sw_measure 验真）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "chenyuansen2580" }]
keywords = ["solidworks", "cad", "skill", "dsh", "automation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
]

# ★ CAD 依赖只在 Windows 上需要；Linux CI 不装 pywin32 也能跑测试
dependencies = [
    "pyyaml>=6.0",
    "pywin32>=305; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
# 注意：仓库已在 GitHub 上改名为 solidworks-hybrid；
# 旧名 solidworks-modeling 由 GitHub 自动重定向到此处。
Homepage = "https://github.com/chenyuansen2580/solidworks-hybrid"
Issues = "https://github.com/chenyuansen2580/solidworks-hybrid/issues"

[tool.setuptools]
# ★ 本仓库是 skill 目录结构（templates/ + references/ + tests/ + examples/），
#   不是可 import 的 Python 包。必须显式禁用自动发现，否则 setuptools 会把
#   templates/ 和 references/ 当成两个顶层包，`pip install -e` 直接失败：
#     error: Multiple top-level packages discovered in a flat-layout:
#            ['templates', 'references']
#   这两行是必须的，删掉 CI 的 Install 步骤就挂。
packages = []
py-modules = []
include-package-data = false

[tool.setuptools.package-data]
"*" = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
